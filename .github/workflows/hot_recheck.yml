name: Hot Recheck

# 2026-08-05: sync.py の毎分ジョブから分離したホット層(直近24時間のスレッド全件)
# 専用ワークフロー。
#
# 2026-08-06: 当初は GitHub Actions のネイティブ schedule(cron: "0 * * * *")
# だけで運用していたが、追加から30分以上経っても一度も自動発火しなかった
# (workflow_dispatchでの手動実行は正常に成功することを確認済み — コード側の
# 問題ではなく、トリガー自体が発火しない/著しく遅延する事象)。GitHub Actions
# のネイティブscheduleは新規追加直後や毎時0分ジャストのタイミングで遅延・
# スキップされることが知られており、それに当たったとみられる。他の毎分系
# ジョブ(sync_comments等)と同じ cron-job.org 経由の repository_dispatch に
# 切り替えて確実性を優先した。scheduleブロックは撤去済み — cron-job.org側で
# event_type: hot-recheck を1時間おきに送るよう設定すること
# (AGENTS.mdの「cron-job.org → GitHub Actions repository_dispatch 設定」参照)。
on:
  repository_dispatch:
    types: [hot-recheck]
  workflow_dispatch: {}

concurrency:
  group: hot-recheck
  cancel-in-progress: false

jobs:
  hot_recheck:
    runs-on: ubuntu-latest
    # コールド層を含む毎分ジョブ(timeout-minutes: 10)とは別枠。
    # Pass2(食い違いスレッドの完全再取得、逐次HTTP)がバーストで数千件規模に
    # なることを見込んで余裕を持たせる。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify secret
        if: github.event_name == 'repository_dispatch'
        env:
          RECEIVED_CRONJOB_SECRET: ${{ github.event.client_payload.secret }}
          CRONJOB_SECRET: ${{ secrets.CRONJOB_SECRET }}
        run: |
          if [[ "$RECEIVED_CRONJOB_SECRET" != "$CRONJOB_SECRET" ]]; then
            echo "Invalid secret"
            exit 1
          fi

      - name: Run hot recheck
        env:
          API_KEY_FOR_ALL_COMMENT_GET:  ${{ secrets.API_KEY_FOR_ALL_COMMENT_GET }}
          API_KEY_FOR_ALL_COMMENT_GET2: ${{ secrets.API_KEY_FOR_ALL_COMMENT_GET2 }}
          API_KEY_FOR_ALL_COMMENT_GET3: ${{ secrets.API_KEY_FOR_ALL_COMMENT_GET3 }}
          VIDEO_ID:         ${{ vars.VIDEO_ID }}
          TURSO_URL:        ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # バースト用安全弁(2026-08-05、年次バーストイベント想定)。再デプロイ無しで
          # GitHub Variables 側から値を変えられるのが目的。
          # デフォルトは5000×30分の旧設定より広い25000×60分相当
          # (2025-08-10実績: 1日のスレッド数38,863件に対し旧5000は約13%しか
          # カバーできなかったため — 詳細はAGENTS.mdの年次バースト耐性調査メモ参照)。
          SYNC_HOT_BATCH_CAP:     ${{ vars.SYNC_HOT_BATCH_CAP || '25000' }}
          SYNC_HOT_PASS2_RUN_CAP: ${{ vars.SYNC_HOT_PASS2_RUN_CAP || '2000' }}
        run: python hot_recheck.py
