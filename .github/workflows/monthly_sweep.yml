name: Monthly Sweep

on:
  repository_dispatch:
    types: [sync-comments-monthly]
  workflow_dispatch:
    inputs:
      days:
        description: "遡る日数"
        required: false
        default: "31"
      window_end:
        description: "固定スキャン窓の終了epoch秒（初回再開用）"
        required: false
        default: ""
      resume_from_published_at:
        description: "手動復旧用: このpublished_atより後ろから開始(resume_from_comment_idと併用必須、restart時のみ有効)"
        required: false
        default: ""
      resume_from_comment_id:
        description: "手動復旧用: resume_from_published_atと同じ行のcomment_id"
        required: false
        default: ""
      restart:
        description: "既存カーソルを破棄して新規開始"
        type: boolean
        required: false
        default: false
      dry_run:
        description: "対象件数と概算コストだけ出す"
        type: boolean
        required: false
        default: false

concurrency:
  group: sync-comments-monthly
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # monthly_sweep.py の TIME_BUDGET_SEC(300分)より長く取り、時間予算超過後に
    # 進行中のチャンクを完了してから正常終了する猶予(実測: 1チャンク5000件で
    # 8〜10分)+ セットアップのオーバーヘッドを吸収する。GitHub Actionsの単一
    # ジョブ上限(360分)には収まる範囲。
    timeout-minutes: 330
    steps:
      - name: Check JST monthly schedule
        id: jst_gate
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" && "$(TZ=Asia/Tokyo date +%d)" != "01" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the first day of the month in JST; skipping monthly sweep."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.jst_gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.jst_gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.jst_gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Verify secret
        if: github.event_name == 'repository_dispatch' && steps.jst_gate.outputs.run == 'true'
        env:
          RECEIVED_CRONJOB_SECRET: ${{ github.event.client_payload.secret }}
          CRONJOB_SECRET: ${{ secrets.CRONJOB_SECRET }}
        run: |
          if [[ "$RECEIVED_CRONJOB_SECRET" != "$CRONJOB_SECRET" ]]; then
            echo "Invalid secret"
            exit 1
          fi

      - name: Run monthly sweep
        if: steps.jst_gate.outputs.run == 'true'
        env:
          API_KEY_FOR_MONTHLY_SWEEP: ${{ secrets.API_KEY_FOR_MONTHLY_SWEEP }}
          VIDEO_ID:                  ${{ vars.VIDEO_ID }}
          TURSO_URL:                 ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN:          ${{ secrets.TURSO_AUTH_TOKEN }}
          SWEEP_DAYS:                ${{ github.event.inputs.days || '31' }}
          SWEEP_WINDOW_END:          ${{ github.event.inputs.window_end || '' }}
          SWEEP_RESUME_FROM_PUBLISHED_AT: ${{ github.event.inputs.resume_from_published_at || '' }}
          SWEEP_RESUME_FROM_COMMENT_ID:   ${{ github.event.inputs.resume_from_comment_id || '' }}
          # jst_gateがrun=trueにするのはworkflow_dispatch(手動)か、repository_dispatchの
          # JST1日のみ。つまりrepository_dispatchでここに来た時点で「今日は月初」が
          # 確定しているので、無条件で--restartを強制する。これが無いと、前月分が
          # in_progressのまま残っている場合(タイムアウト・クラッシュ等)に自動実行が
          # 新しい月の窓へ進まず、前月の古い窓をいつまでも再開し続けてしまう
          # (analytics_aggregates_monthly.ymlのFORCE_NETWORK_FULLと同じ考え方)。
          # 手動実行(workflow_dispatch)はこれまで通りrestart入力に従う(既定false=resume)。
          SWEEP_RESTART:             ${{ github.event_name == 'repository_dispatch' || github.event.inputs.restart || 'false' }}
          SWEEP_DRY_RUN:             ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS="--days $SWEEP_DAYS"
          if [[ -n "$SWEEP_WINDOW_END" ]]; then
            ARGS="$ARGS --window-end $SWEEP_WINDOW_END"
          fi
          if [[ -n "$SWEEP_RESUME_FROM_PUBLISHED_AT" ]]; then
            ARGS="$ARGS --resume-from-published-at $SWEEP_RESUME_FROM_PUBLISHED_AT --resume-from-comment-id $SWEEP_RESUME_FROM_COMMENT_ID"
          fi
          if [[ "$SWEEP_RESTART" == "true" ]]; then
            ARGS="$ARGS --restart"
          fi
          if [[ "$SWEEP_DRY_RUN" == "true" ]]; then
            ARGS="$ARGS --dry-run"
          fi
          python monthly_sweep.py $ARGS
